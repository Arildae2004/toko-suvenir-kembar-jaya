<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="3" filter="url(#dropShadow)" />

  <!-- Tenun Ikat Geometric Accents in Corners -->
  <path d="M 64 11 L 71 18 L 64 25 L 57 18 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M 11 64 L 18 71 L 25 64 L 18 57 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M 117 64 L 110 71 L 103 64 L 110 57 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M 64 117 L 71 110 L 64 103 L 57 110 Z" fill="#fbbf24" opacity="0.9" />

  <!-- Sparkles -->
  <path d="M 96 28 Q 100 32 104 32 Q 100 32 96 36 Q 96 32 92 32 Q 96 32 96 28 Z" fill="#fef08a" />
  <path d="M 28 34 Q 31 37 34 37 Q 31 37 28 40 Q 28 37 25 37 Q 28 37 28 34 Z" fill="#fef08a" />

  <!-- Paper Bag Handles (Rope Loop) -->
  <path d="M 48 50 C 48 26 80 26 80 50" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
  <path d="M 48 50 C 48 28 80 28 80 50" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Paper Bag Main Body -->
  <path d="M 33 50 L 95 50 L 100 105 L 28 105 Z" fill="url(#bagGrad)" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Fold Creases -->
  <path d="M 33 50 L 43 105" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="2,2" />
  <path d="M 95 50 L 85 105" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Paper Bag Top Fold / Lip -->
  <rect x="31" y="47" width="66" height="7" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="2" />

  <!-- Center NTT Tenun Motif Emblem on Paper Bag -->
  <!-- Outer Gold Diamond -->
  <path d="M 64 62 L 78 76 L 64 90 L 50 76 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" />
  <!-- Inner Terracotta Diamond -->
  <path d="M 64 67 L 73 76 L 64 85 L 55 76 Z" fill="#7c2d12" />
  <!-- Center Golden Bead -->
  <circle cx="64" cy="76" r="3.5" fill="#fef08a" />

  <!-- Horizontal Motif Dashes across Bag -->
  <line x1="32" y1="76" x2="49" y2="76" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2" />
  <line x1="79" y1="76" x2="96" y2="76" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2" />
</svg>
